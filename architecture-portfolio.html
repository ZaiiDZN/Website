<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Portfolio (Spring 2026) - zaivion hampden</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
        }

        .portfolio-request-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #fff;
        }

        .portfolio-header {
            width: 100%;
            height: 3rem;
            display: flex;
            align-items: center;
            padding: 0 2rem;
        }

        .portfolio-header-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .portfolio-header-links a,
        .portfolio-request-card a {
            color: rgba(0, 0, 0, 0.64);
            text-decoration: none;
            font-weight: 300;
            text-transform: lowercase;
            letter-spacing: -0.02em;
            transition: color 0.3s ease;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .portfolio-header-links a {
            font-size: 0.9rem;
        }

        .portfolio-header-links a:hover,
        .portfolio-request-card a:hover {
            color: var(--primary-color);
        }

        .portfolio-request-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .portfolio-request-card {
            width: 100%;
            max-width: 42rem;
            text-align: center;
            color: rgba(0, 0, 0, 0.72);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .portfolio-request-card h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
            color: rgba(0, 0, 0, 0.82);
        }

        .portfolio-request-card p {
            font-size: 1rem;
            line-height: 1.7;
            margin: 0 auto 1.5rem;
            max-width: 34rem;
        }

        .portfolio-request-card a {
            display: inline-block;
            font-size: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.32);
        }
    </style>
</head>
<body>
    <main class="portfolio-request-page">
        <div class="portfolio-header">
            <div class="portfolio-header-links">
                <a href="index.html">home</a>
                <a href="projects.html">back</a>
            </div>
        </div>

        <div class="portfolio-request-content">
            <div class="portfolio-request-card">
                <h1>architecture portfolio.</h1>
                <p>
                    This portfolio is available by request. Please reach out directly for a current
                    copy of the Spring 2026 architecture portfolio.
                </p>
                <a href="contact.html">contact</a>
            </div>
        </div>
    </main>
</body>
</html>
