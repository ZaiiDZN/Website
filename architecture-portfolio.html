<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Portfolio (Spring 2026) - zaivion hampden</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .portfolio-notice {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .portfolio-notice-content {
            max-width: 34rem;
            text-align: center;
        }

        .portfolio-notice-content h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 300;
            line-height: 0.95;
            letter-spacing: -0.06em;
            margin: 0 0 1.5rem;
            text-transform: lowercase;
        }

        .portfolio-notice-content p {
            margin: 0 auto 2rem;
            max-width: 28rem;
            color: rgba(0, 0, 0, 0.64);
            font-size: 1rem;
            line-height: 1.5;
        }

        .portfolio-notice-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.25rem;
        }

        .portfolio-notice-links a {
            color: rgba(0, 0, 0, 0.64);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 300;
            text-transform: lowercase;
            letter-spacing: -0.02em;
            transition: color 0.3s ease;
        }

        .portfolio-notice-links a:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <main class="portfolio-notice">
        <div class="portfolio-notice-content">
            <h1>architecture portfolio.</h1>
            <p>This portfolio is available on request. Please get in touch for access to the current version.</p>
            <div class="portfolio-notice-links">
                <a href="contact.html">contact</a>
                <a href="projects.html">back</a>
                <a href="index.html">home</a>
            </div>
        </div>
    </main>
</body>
</html>
