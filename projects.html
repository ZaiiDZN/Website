<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections / Projects - zaivion hampden</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="projects-page">
        <div class="page-content">
            <a href="index.html" class="home-link-left">home</a>
            
            <h1 class="page-title">collections / projects.</h1>
            
            <div class="projects-list two-column">
                <div class="projects-column column-left">
                    <ul class="projects-ul" id="collections-list">
                        <!-- Collections loaded from text file -->
                    </ul>
                </div>
                <div class="projects-column column-right">
                    <ul class="projects-ul">
                        <li>
                            <a href="architecture-portfolio.html" class="project-link">Architecture Portfolio (Spring 2026)</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        const projectUrls = {
            'All White Galleries (Collection, 2026)': 'all-white-galleries.html',
            'I Think Narcissus Fell In (Collection, 2025)': 'i-think-narcissus-fell-in.html',
            'Archive (Collection, 2023)': 'archive-project.html'
        };

        const partialItalicTitles = {
            'All White Galleries (Collection, 2026)': {
                italic: 'All White Galleries',
                regular: ' (Collection, 2026)'
            },
            'I Think Narcissus Fell In (Collection, 2025)': {
                italic: 'I Think Narcissus Fell In',
                regular: ' (Collection, 2025)'
            },
            'Archive (Collection, 2023)': {
                italic: 'Archive',
                regular: ' (Collection, 2023)'
            }
        };

        function createListItem(projectName) {
            const li = document.createElement('li');
            const url = projectUrls[projectName];
            const titleParts = partialItalicTitles[projectName];

            if (!url) {
                console.warn('No URL mapping found for:', projectName);
                li.textContent = projectName;
                return li;
            }

            const link = document.createElement('a');
            link.href = url;
            link.className = 'project-link';

            if (titleParts) {
                const italic = document.createElement('i');
                italic.textContent = titleParts.italic;
                link.appendChild(italic);
                link.appendChild(document.createTextNode(titleParts.regular));
            } else {
                link.textContent = projectName;
            }

            li.appendChild(link);
            return li;
        }

        async function loadList(filePath, listElement) {
            if (!listElement) return;

            const response = await fetch(filePath);
            if (!response.ok) {
                throw new Error(`Failed to load ${filePath}`);
            }

            const text = await response.text();
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);

            listElement.innerHTML = '';

            lines.forEach(projectName => {
                listElement.appendChild(createListItem(projectName));
            });
        }

        async function loadProjectsPage() {
            const collectionsList = document.getElementById('collections-list');
            if (!collectionsList) return;

            try {
                await loadList('images/collections-list.txt', collectionsList);
            } catch (error) {
                console.error('Error loading projects page:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadProjectsPage);
    </script>
</body>
</html>
